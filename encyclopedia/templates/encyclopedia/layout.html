{% load static %}
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Wiki{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <h2><a href="{% url 'index' %}" style="text-decoration: none; color: black;">Wiki</a></h2>
                
                <form action="{% url 'search' %}" method="get" class="my-3">
                    <input type="text" name="q" class="form-control" placeholder="Search Encyclopedia">
                </form>

                <ul class="list-unstyled">
                    <li><a href="{% url 'index' %}">Home</a></li>
                    <li><a href="{% url 'new_page' %}">Create New Page</a></li>
                    <li><a href="{% url 'random_page' %}">Random Page</a></li>
                </ul>
            </div>
            <div class="col-md-9">
                {% block body %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
