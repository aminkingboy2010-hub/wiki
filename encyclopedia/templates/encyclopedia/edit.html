{% extends "encyclopedia/layout.html" %}
{% block body %}
    <h1>Edit {{ title }}</h1>
    <form action="{% url 'edit_page' title=title %}" method="post">
        {% csrf_token %}
        <textarea name="content" rows="10" cols="50" required>{{ content }}</textarea>
        <br><br>
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
